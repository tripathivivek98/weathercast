plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tripathivivek98.weathercast'
    compileSdk 36

    defaultConfig {
        applicationId "com.tripathivivek98.weathercast"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        // This is necessary to use Data Binding in your project
        dataBinding= true
    }
}

dependencies {
    // Define the lifecycle version for consistency
    def lifecycle_version = "2.9.4"

    // --- Core Dependencies (Updated versions) ---
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.activity:activity-ktx:1.11.0'

    // --- MVVM and Coroutines Dependencies (REQUIRED for ViewModel) ---
    // ViewModel KTX for 'by viewModels()' delegate and 'viewModelScope'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    // LiveData KTX for LiveData extensions
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    // Kotlin Coroutines for structured concurrency
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
